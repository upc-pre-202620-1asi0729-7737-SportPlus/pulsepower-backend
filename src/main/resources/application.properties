spring.application.name=PulsePowerBackend
spring.profiles.default=dev

spring.jpa.hibernate.naming.physical-strategy=com.sportplus.pulsepower.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

documentation.application.description=PulsePower training, sleep, wellness and recovery platform REST API
documentation.application.version=v1
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:30}

pulsepower.seed.demo-users.enabled=false
pulsepower.seed.demo-users.password=${DEMO_USERS_PASSWORD:PulsePower2026}
pulsepower.seed.demo-subscription-plans.enabled=false
pulsepower.seed.demo-achievements.enabled=false
pulsepower.seed.demo-training.enabled=false
pulsepower.seed.demo-sleep.enabled=false
pulsepower.seed.demo-wellness.enabled=false
pulsepower.seed.demo-physiology.enabled=false

pulsepower.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
