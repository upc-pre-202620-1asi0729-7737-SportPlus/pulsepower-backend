server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/pulsepower
spring.datasource.username=${DB_USERNAME:pulsepower_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

authorization.jwt.secret=${JWT_SECRET:pulsepower-development-secret-key-change-me-in-production-2026}

pulsepower.seed.demo-users.enabled=true
pulsepower.seed.demo-subscription-plans.enabled=true
pulsepower.seed.demo-achievements.enabled=true
pulsepower.seed.demo-training.enabled=true
pulsepower.seed.demo-sleep.enabled=true
pulsepower.seed.demo-wellness.enabled=true
pulsepower.seed.demo-physiology.enabled=true
